<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1218">
<title>نظام متابعة الكباتن</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0e1116; --panel: #171b22; --panel-2: #1c212a; --line: #2a303c;
    --text: #e8ebf0; --muted: #8c96a6; --accent: #d99a3c; --accent-soft: rgba(217,154,60,0.14);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; padding:28px 18px 60px; }
  .wrap{ max-width: 760px; margin: 0 auto; }
  header{ margin-bottom: 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  h1{ font-size: 1.4rem; font-weight:700; margin:0 0 4px; }
  .sub{ color: var(--muted); font-size: 0.88rem; display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#3b9a52; display:inline-block; }
  .dot.off{ background:#c0453c; }
  .backup{ display:flex; gap:8px; flex-wrap:wrap; }
  .icon-btn{ background: var(--line); border:1px solid var(--line); color: var(--text); border-radius:7px; padding:7px 12px; font-size:0.8rem; cursor:pointer; }
  .icon-btn:hover{ background:#384155; }
  #logoutBtn{ background:#55211c; border-color:#55211c; color:#fff; }
  #logoutBtn:hover{ filter:brightness(1.25); }

  .view-switch{ display:flex; gap:8px; margin-bottom:18px; }
  .view-btn{ flex:1; padding:11px; text-align:center; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:0.92rem; cursor:pointer; font-weight:600; }
  .view-btn.active{ background:var(--accent); border-color:var(--accent); color:#211705; }
  .view{ display:none; }
  .view.active{ display:block; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:20px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .row > *{ flex:1; min-width:140px; }
  label{ display:block; font-size:0.82rem; color:var(--muted); margin-bottom:5px; }
  input[type=text],input[type=email],input[type=password],input[type=date],textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:9px 11px; font-size:0.95rem; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:50px; }
  input:focus,textarea:focus{ outline:none; border-color:var(--accent); }
  .field-error{ color:#f0a89c; font-size:0.78rem; margin-top:5px; display:none; }
  .field-error.show{ display:block; }
  .hint{ color:var(--muted); font-size:0.78rem; margin-top:4px; }
  .hint.match{ color:#9fe0ae; }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{ padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .chip.active{ border-color:var(--accent); background:var(--accent); color:#211705; font-weight:600; }
  .chip.add{ border-style:dashed; color:var(--accent); }
  .chip-x{ opacity:0.6; font-weight:700; }
  .chip-x:hover{ opacity:1; color:#f0a89c; }

  .new-box{ display:none; gap:8px; align-items:center; margin:-4px 0 12px; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .new-box.open{ display:flex; }
  .new-box input{ flex:1; min-width:120px; }

  .date-presets{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
  .preset-chip{ padding:6px 12px; border-radius:16px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:0.78rem; cursor:pointer; }
  .preset-chip:hover{ border-color:var(--accent); color:var(--accent); }
  .preset-chip.clear{ border-color:#55211c; color:#e18179; }
  .preset-chip.clear:hover{ background:#55211c; color:#fff; }

  .note-presets{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
  .note-chip{ padding:6px 12px; border-radius:16px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:0.78rem; cursor:pointer; }
  .note-chip:hover{ border-color:var(--accent); color:var(--accent); }

  button.primary{ background:var(--accent); color:#211705; border:none; padding:10px 20px; border-radius:7px; font-weight:600; font-size:0.95rem; cursor:pointer; }
  button.primary:hover{ filter:brightness(1.08); }
  button.primary:disabled{ opacity:0.5; cursor:default; }

  .dash-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .dash-tab{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .dash-tab .n{ background:rgba(255,255,255,0.1); border-radius:10px; padding:1px 7px; font-size:0.75rem; }
  .dash-tab[data-tone="red"]{ border-color:#55211c; background:#55211c; }
  .dash-tab[data-tone="amber"]{ border-color:#5c4310; background:#5c4310; }
  .dash-tab[data-tone="blue"]{ border-color:#1e3a5c; background:#1e3a5c; }
  .dash-tab[data-tone="green"]{ border-color:#1f4d2c; background:#1f4d2c; }
  .dash-tab.active{ box-shadow:0 0 0 1px var(--accent) inset; font-weight:600; }
  .dash-tab:not([data-tone]).active{ background:var(--accent); color:#211705; }

  .assignee-filter{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
  .af-chip{ padding:6px 12px; border-radius:16px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:0.8rem; cursor:pointer; }
  .af-chip.active{ border-color:var(--accent); color:var(--accent); font-weight:600; }

  .search{ margin-bottom:14px; }
  .count{ color:var(--muted); font-size:0.85rem; margin-bottom:10px; }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card.overdue{ border-color:#c0453c; }
  .card.done{ opacity:0.6; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .name{ font-weight:700; font-size:1.02rem; }
  .phone{ color:var(--muted); font-size:0.85rem; margin-top:2px; }
  .desc{ margin-top:6px; font-size:0.92rem; color:var(--text); }
  .badges{ display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .badge{ font-size:0.76rem; padding:4px 11px; border-radius:20px; white-space:nowrap; font-weight:600; }
  .badge.type{ background:rgba(255,255,255,0.08); color:var(--text); }
  .badge.status-new{ background:#333c48; color:#fff; }
  .badge.status-in_progress{ background:#1e3a5c; color:#fff; }
  .badge.status-waiting_captain{ background:#5c4310; color:#fff; }
  .badge.status-resolved{ background:#1f4d2c; color:#fff; }
  .badge.status-closed_unresolved{ background:#55211c; color:#fff; }
  .task-line{ margin-top:8px; font-size:0.82rem; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .task-line.overdue{ color:#f0a89c; font-weight:600; }
  .assignee-tag{ background:rgba(255,255,255,0.08); padding:2px 9px; border-radius:12px; font-size:0.76rem; }
  .notes{ margin-top:8px; font-size:0.9rem; color:#c3c9d2; line-height:1.5; white-space:pre-wrap; }
  .meta{ margin-top:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .date{ font-size:0.75rem; color:var(--muted); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .actions button{ border:1px solid var(--line); border-radius:6px; padding:6px 11px; background:var(--panel-2); color:var(--text); font-size:0.78rem; cursor:pointer; }
  .actions button.go-waiting{ border-color:#5c4310; background:#5c4310; color:#fff; }
  .actions button.go-progress{ border-color:#1e3a5c; background:#1e3a5c; color:#fff; }
  .actions button.go-resolved{ border-color:#1f4d2c; background:#1f4d2c; color:#fff; }
  .actions button.go-done{ border-color:#1f4d2c; background:#1f4d2c; color:#fff; }
  .actions button.go-closed{ border-color:#55211c; background:#55211c; color:#fff; }
  .actions button.danger{ border-color:#55211c; background:#55211c; color:#fff; }
  .actions button:hover{ filter:brightness(1.2); }

  .empty{ text-align:center; color:var(--muted); padding:40px 10px; font-size:0.92rem; }

  #loginScreen{ max-width:360px; margin:60px auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px; }
  #loginScreen h2{ margin:0 0 4px; font-size:1.2rem; }
  #loginScreen p{ color:var(--muted); font-size:0.85rem; margin:0 0 18px; }
  #loginScreen label{ margin-top:10px; }
  #loginError{ color:#f0a89c; font-size:0.85rem; margin-top:10px; display:none; }
  #loginBtn{ width:100%; margin-top:16px; }
  #appRoot{ display:none; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>نظام متابعة الكباتن</h2>
  <p>سجّل الدخول للمتابعة</p>
  <label>البريد الإلكتروني</label>
  <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
  <label>كلمة المرور</label>
  <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
  <div id="loginError">بيانات الدخول غير صحيحة</div>
  <button class="primary" id="loginBtn">دخول</button>
</div>

<div id="appRoot" class="wrap">
  <header>
    <div>
      <h1>متابعة الكباتن</h1>
      <div class="sub"><span class="dot" id="statusDot"></span><span id="statusText">جاري الاتصال...</span></div>
    </div>
    <div class="backup">
      <button class="icon-btn" id="exportBtn">تنزيل نسخة احتياطية</button>
      <button class="icon-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <div class="view-switch">
    <div class="view-btn active" id="tasksViewBtn">المهام والجدولة</div>
    <div class="view-btn" id="casesViewBtn">الحالات</div>
  </div>

  <!-- ============ عرض المهام ============ -->
  <div class="view active" id="tasksView">
    <div class="panel">
      <div class="row">
        <div>
          <label>رقم الجوال (اختياري)</label>
          <input type="text" id="tPhone" placeholder="05xxxxxxxx">
          <div class="hint" id="tPhoneHint"></div>
        </div>
        <div>
          <label>اسم الكابتن</label>
          <input type="text" id="tName" placeholder="مثال: محمد أحمد">
        </div>
      </div>

      <label>توضيح المهمة</label>
      <textarea id="tDesc" placeholder="مثال: الاتصال بالكابتن لتذكيره بتحديث الوثيقة"></textarea>

      <label style="margin-top:12px;">إسناد إلى (الفريق)</label>
      <div class="chip-row" id="teamRow"></div>
      <div class="new-box" id="newTeamBox">
        <input type="text" id="newTeamName" placeholder="اسم عضو جديد بالفريق">
        <button class="icon-btn" id="addTeamConfirm">إضافة</button>
      </div>

      <label>تاريخ المهمة</label>
      <div class="date-presets" id="datePresets">
        <div class="preset-chip" data-preset="today">اليوم</div>
        <div class="preset-chip" data-preset="tomorrow">غدًا</div>
        <div class="preset-chip" data-day="0">الأحد</div>
        <div class="preset-chip" data-day="1">الاثنين</div>
        <div class="preset-chip" data-day="2">الثلاثاء</div>
        <div class="preset-chip" data-day="3">الأربعاء</div>
        <div class="preset-chip" data-day="4">الخميس</div>
        <div class="preset-chip" data-day="5">الجمعة</div>
        <div class="preset-chip" data-day="6">السبت</div>
        <div class="preset-chip clear" id="clearTaskDate">بدون تاريخ</div>
      </div>
      <input type="date" id="taskDate">

      <div style="margin-top:14px; display:flex; justify-content:flex-end;">
        <button class="primary" id="saveTaskBtn">إضافة مهمة</button>
      </div>
    </div>

    <div class="dash-tabs" id="taskTabs"></div>
    <div class="assignee-filter" id="assigneeFilter"></div>
    <input type="text" class="search" id="taskSearch" placeholder="بحث بالاسم أو رقم الجوال...">
    <div class="count" id="taskCount"></div>
    <div class="list" id="taskList"></div>
  </div>

  <!-- ============ عرض الحالات ============ -->
  <div class="view" id="casesView">
    <div class="panel">
      <div class="row">
        <div>
          <label>رقم الجوال (اختياري)</label>
          <input type="text" id="cPhone" placeholder="05xxxxxxxx">
          <div class="field-error" id="cPhoneError"></div>
          <div class="hint" id="cPhoneHint"></div>
        </div>
        <div>
          <label>اسم الكابتن</label>
          <input type="text" id="cName" placeholder="مثال: محمد أحمد">
        </div>
      </div>

      <label>نوع الحالة</label>
      <div class="chip-row" id="typeRow"></div>
      <div class="new-box" id="newTypeBox">
        <input type="text" id="newTypeLabel" placeholder="اسم نوع جديد">
        <button class="icon-btn" id="addTypeConfirm">إضافة</button>
      </div>

      <label>ملاحظات</label>
      <div class="note-presets" id="notePresets">
        <div class="note-chip">وعد بالمعالجة</div>
        <div class="note-chip">متوقف بسبب سفر</div>
        <div class="note-chip">بانتظار الرد</div>
        <div class="note-chip">تم التواصل ولم يستجب</div>
        <div class="note-chip">بانتظار معاينة</div>
      </div>
      <textarea id="cNotes" placeholder="اكتب أي تفاصيل إضافية..."></textarea>

      <div style="margin-top:14px; display:flex; justify-content:flex-end;">
        <button class="primary" id="saveCaseBtn">إضافة حالة متابعة</button>
      </div>
    </div>

    <div class="dash-tabs" id="caseTabs"></div>
    <input type="text" class="search" id="caseSearch" placeholder="بحث بالاسم أو رقم الجوال...">
    <div class="count" id="caseCount"></div>
    <div class="list" id="caseList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mjelywusygupbhguppxl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdEAOsPd9-s5t3tq11xweQ_BQ9ZieBD';
const REST = `${SUPABASE_URL}/rest/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;

let accessToken = sessionStorage.getItem('cl_access_token') || null;
let refreshToken = sessionStorage.getItem('cl_refresh_token') || null;
let inactivityTimer = null;
let refreshTimer = null;

function authHeaders(){
  return { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' };
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  resetInactivityTimer();
  loadAll();
}
function showLogin(msg){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  clearTimeout(inactivityTimer);
  if(msg){
    const err = document.getElementById('loginError');
    err.textContent = msg;
    err.style.display = 'block';
  }
}
function doLogout(msg){
  accessToken = null; refreshToken = null;
  clearTimeout(refreshTimer);
  sessionStorage.removeItem('cl_access_token');
  sessionStorage.removeItem('cl_refresh_token');
  showLogin(msg || null);
}
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    doLogout('تم تسجيل خروجك تلقائيًا بعد ٣٠ دقيقة من عدم النشاط، سجّل الدخول مرة أخرى');
  }, INACTIVITY_LIMIT_MS);
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt => {
  document.addEventListener(evt, () => { if(accessToken) resetInactivityTimer(); });
});

async function refreshSession(){
  if(!refreshToken) return false;
  try{
    const res = await fetch(`${AUTH}/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    accessToken = data.access_token; refreshToken = data.refresh_token;
    sessionStorage.setItem('cl_access_token', accessToken);
    sessionStorage.setItem('cl_refresh_token', refreshToken);
    scheduleRefresh(data.expires_in || 3600);
    return true;
  }catch(e){ return false; }
}
function scheduleRefresh(expiresInSeconds){
  clearTimeout(refreshTimer);
  const delay = Math.max((expiresInSeconds - 120) * 1000, 15000);
  refreshTimer = setTimeout(async () => {
    const ok = await refreshSession();
    if(!ok) doLogout('انتهت الجلسة، سجّل الدخول مرة أخرى');
  }, delay);
}

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  if(!email || !password) return;
  try{
    const res = await fetch(`${AUTH}/token?grant_type=password`, {
      method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if(!res.ok){ errBox.textContent = 'بيانات الدخول غير صحيحة'; errBox.style.display = 'block'; return; }
    const data = await res.json();
    accessToken = data.access_token; refreshToken = data.refresh_token;
    sessionStorage.setItem('cl_access_token', accessToken);
    sessionStorage.setItem('cl_refresh_token', refreshToken);
    scheduleRefresh(data.expires_in || 3600);
    showApp();
  }catch(e){ errBox.textContent = 'تعذر الاتصال، حاول مرة أخرى'; errBox.style.display = 'block'; }
};
document.getElementById('logoutBtn').onclick = () => doLogout();

async function api(path, options = {}){
  let res = await fetch(`${REST}/${path}`, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  if(res.status === 401){
    const refreshed = await refreshSession();
    if(refreshed) res = await fetch(`${REST}/${path}`, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
    if(!refreshed || res.status === 401){ doLogout('انتهت الجلسة، سجّل الدخول مرة أخرى'); throw new Error('unauthorized'); }
  }
  if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error(`${res.status} ${t}`); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function setConnection(ok, msg){
  document.getElementById('statusDot').classList.toggle('off', !ok);
  document.getElementById('statusText').textContent = msg;
}

// ---- التبديل بين العرضين ----
document.getElementById('tasksViewBtn').onclick = () => switchView('tasks');
document.getElementById('casesViewBtn').onclick = () => switchView('cases');
function switchView(v){
  document.getElementById('tasksView').classList.toggle('active', v === 'tasks');
  document.getElementById('casesView').classList.toggle('active', v === 'cases');
  document.getElementById('tasksViewBtn').classList.toggle('active', v === 'tasks');
  document.getElementById('casesViewBtn').classList.toggle('active', v === 'cases');
}

// ---- حالة عامة ----
let captains = [];
let cases = [];
let tasks = [];
let team = [];
const DEFAULT_TYPES = ['شكوى','طلب وثيقة','مخالفة','استفسار'];
let types = [];
let selectedType = null;
let selectedAssignee = null;
let selectedTaskDate = '';
let taskDashFilter = 'due';
let caseDashFilter = 'due';
let assigneeFilter = null;

function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return localDateStr(new Date()); }
function addDaysStr(n){ const d = new Date(); d.setDate(d.getDate()+n); return localDateStr(d); }
function nextWeekdayStr(targetDay){
  const d = new Date();
  const diff = (targetDay - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return localDateStr(d);
}
function formatDate(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
}
function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function captainOf(entity){ return captains.find(x => x.id === entity.captain_id) || { name:'—', phone:'' }; }

async function loadAll(){
  try{
    captains = await api('captains?select=id,name,phone');
    cases = await api('cases?select=*&order=updated_at.desc');
    tasks = await api('tasks?select=*&order=updated_at.desc');
    team = await api('team_members?select=*&order=name.asc');
    const dbTypes = [...new Set(cases.map(c => c.case_type))];
    types = [...new Set([...DEFAULT_TYPES, ...dbTypes])];
    if(!selectedType) selectedType = types[0];
    setConnection(true, 'متصل — البيانات تتزامن أونلاين');
    document.getElementById('saveTaskBtn').disabled = false;
    document.getElementById('saveCaseBtn').disabled = false;
    renderTeamChips();
    renderTypeChips();
    renderTaskTabs();
    renderAssigneeFilter();
    renderCaseTabs();
    renderTasks();
    renderCases();
  }catch(e){
    setConnection(false, 'تعذر الاتصال بقاعدة البيانات');
    document.getElementById('saveTaskBtn').disabled = true;
    document.getElementById('saveCaseBtn').disabled = true;
  }
}

// ================= الفريق =================
const teamRow = document.getElementById('teamRow');
const newTeamBox = document.getElementById('newTeamBox');
function renderTeamChips(){
  teamRow.innerHTML = '';
  team.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedAssignee === m.id ? ' active' : '');
    chip.innerHTML = `${escapeHtml(m.name)}<span class="chip-x" data-id="${m.id}" title="إزالة من الفريق">×</span>`;
    chip.onclick = (ev) => {
      if(ev.target.classList.contains('chip-x')) return;
      selectedAssignee = selectedAssignee === m.id ? null : m.id;
      newTeamBox.classList.remove('open');
      renderTeamChips();
    };
    chip.querySelector('.chip-x').onclick = async (ev) => {
      ev.stopPropagation();
      if(!confirm(`إزالة "${m.name}" من الفريق؟`)) return;
      try{
        await api(`team_members?id=eq.${m.id}`, { method:'DELETE' });
        team = team.filter(x => x.id !== m.id);
        if(selectedAssignee === m.id) selectedAssignee = null;
        renderTeamChips(); renderAssigneeFilter();
      }catch(err){ alert('تعذر الحذف'); }
    };
    teamRow.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add';
  addChip.textContent = '+ عضو جديد';
  addChip.onclick = () => newTeamBox.classList.toggle('open');
  teamRow.appendChild(addChip);
}
document.getElementById('addTeamConfirm').onclick = async () => {
  const input = document.getElementById('newTeamName');
  const val = input.value.trim();
  if(!val) { input.focus(); return; }
  try{
    const created = await api('team_members', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify({ name: val }) });
    team.push(created[0]);
    selectedAssignee = created[0].id;
    input.value = '';
    newTeamBox.classList.remove('open');
    renderTeamChips(); renderAssigneeFilter();
  }catch(err){ alert('تعذر الإضافة، ربما الاسم مكرر'); }
};

// ================= نموذج المهام =================
const tName = document.getElementById('tName');
const tPhone = document.getElementById('tPhone');
const tPhoneHint = document.getElementById('tPhoneHint');
const tDesc = document.getElementById('tDesc');
const taskDateEl = document.getElementById('taskDate');
const saveTaskBtn = document.getElementById('saveTaskBtn');

document.querySelectorAll('#datePresets .preset-chip[data-preset]').forEach(chip => {
  chip.onclick = () => { selectedTaskDate = chip.dataset.preset === 'today' ? todayStr() : addDaysStr(1); taskDateEl.value = selectedTaskDate; };
});
document.querySelectorAll('#datePresets .preset-chip[data-day]').forEach(chip => {
  chip.onclick = () => { selectedTaskDate = nextWeekdayStr(parseInt(chip.dataset.day, 10)); taskDateEl.value = selectedTaskDate; };
});
document.getElementById('clearTaskDate').onclick = () => { selectedTaskDate = ''; taskDateEl.value = ''; };
taskDateEl.addEventListener('input', () => { selectedTaskDate = taskDateEl.value; });

tPhone.addEventListener('input', () => {
  const phone = tPhone.value.trim();
  const match = phone ? captains.find(c => (c.phone||'').trim() === phone) : null;
  if(match){
    tPhoneHint.textContent = `✓ كابتن موجود: ${match.name}`;
    tPhoneHint.classList.add('match');
    if(!tName.value.trim()) tName.value = match.name;
  } else {
    tPhoneHint.textContent = ''; tPhoneHint.classList.remove('match');
  }
});

async function findOrCreateCaptain(name, phone){
  let captain = phone ? captains.find(c => (c.phone||'').trim() === phone) : null;
  if(!captain && !phone) captain = captains.find(c => c.name.trim() === name && !c.phone);
  if(captain){
    if(captain.name !== name) await api(`captains?id=eq.${captain.id}`, { method:'PATCH', body: JSON.stringify({ name }) });
    return captain.id;
  }
  const created = await api('captains', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify({ name, phone: phone || null }) });
  captains.push(created[0]);
  return created[0].id;
}

saveTaskBtn.onclick = async () => {
  const name = tName.value.trim();
  if(!name){ tName.focus(); return; }
  const description = tDesc.value.trim();
  if(!description){ tDesc.focus(); return; }
  const phone = tPhone.value.trim();

  saveTaskBtn.disabled = true;
  try{
    const captainId = await findOrCreateCaptain(name, phone);
    await api('tasks', {
      method: 'POST',
      body: JSON.stringify({
        captain_id: captainId, description, assigned_to: selectedAssignee || null,
        due_date: selectedTaskDate || null, status: 'pending',
      }),
    });
    tasks = await api('tasks?select=*&order=updated_at.desc');
    tName.value=''; tPhone.value=''; tDesc.value=''; taskDateEl.value=''; selectedTaskDate=''; tPhoneHint.textContent='';
    renderTaskTabs(); renderTasks();
  }catch(e){
    alert('تعذر الحفظ، تحقق من الاتصال وحاول مرة أخرى');
  }finally{
    saveTaskBtn.disabled = false;
  }
};

function isTaskOverdue(t){ return t.due_date && t.due_date < todayStr() && t.status === 'pending'; }
function taskBucket(t){
  if(t.status === 'done'){
    const days = (Date.now() - new Date(t.updated_at).getTime()) / 86400000;
    return days <= 7 ? 'done' : null;
  }
  if(!t.due_date) return 'due';
  if(t.due_date <= todayStr()) return 'due';
  return 'upcoming';
}
function renderTaskTabs(){
  const counts = { due:0, upcoming:0, done:0 };
  tasks.forEach(t => { const b = taskBucket(t); if(b) counts[b]++; });
  const defs = [
    { id:'due', label:'اليوم ومتأخرة', tone:'red' },
    { id:'upcoming', label:'قادمة', tone:'blue' },
    { id:'done', label:'أُنجزت هذا الأسبوع', tone:'green' },
    { id:'all', label:'الكل', tone:null },
  ];
  const tabsEl = document.getElementById('taskTabs');
  tabsEl.innerHTML = '';
  defs.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'dash-tab' + (taskDashFilter === d.id ? ' active' : '');
    if(d.tone) tab.dataset.tone = d.tone;
    const n = d.id === 'all' ? tasks.length : counts[d.id];
    tab.innerHTML = `${d.label} <span class="n">${n}</span>`;
    tab.onclick = () => { taskDashFilter = d.id; renderTaskTabs(); renderTasks(); };
    tabsEl.appendChild(tab);
  });
}
function renderAssigneeFilter(){
  const el = document.getElementById('assigneeFilter');
  el.innerHTML = '';
  if(team.length === 0) return;
  const allChip = document.createElement('div');
  allChip.className = 'af-chip' + (assigneeFilter === null ? ' active' : '');
  allChip.textContent = 'كل الفريق';
  allChip.onclick = () => { assigneeFilter = null; renderAssigneeFilter(); renderTasks(); };
  el.appendChild(allChip);
  team.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'af-chip' + (assigneeFilter === m.id ? ' active' : '');
    chip.textContent = m.name;
    chip.onclick = () => { assigneeFilter = m.id; renderAssigneeFilter(); renderTasks(); };
    el.appendChild(chip);
  });
}

function renderTasks(){
  const q = document.getElementById('taskSearch').value.trim().toLowerCase();
  let items = tasks.filter(t => {
    const cap = captainOf(t);
    return !q || cap.name.toLowerCase().includes(q) || (cap.phone||'').includes(q);
  });
  if(taskDashFilter !== 'all') items = items.filter(t => taskBucket(t) === taskDashFilter);
  if(assigneeFilter) items = items.filter(t => t.assigned_to === assigneeFilter);
  items = [...items].sort((a,b) => {
    if(taskDashFilter === 'due' || taskDashFilter === 'upcoming') return (a.due_date || '9999').localeCompare(b.due_date || '9999');
    return new Date(b.updated_at) - new Date(a.updated_at);
  });

  const listEl = document.getElementById('taskList');
  document.getElementById('taskCount').textContent = items.length ? `${items.length} مهمة` : '';
  if(items.length === 0){ listEl.innerHTML = `<div class="empty">لا توجد مهام في هذا القسم</div>`; return; }

  listEl.innerHTML = '';
  items.forEach(t => {
    const cap = captainOf(t);
    const overdue = isTaskOverdue(t);
    const assignee = team.find(m => m.id === t.assigned_to);
    const card = document.createElement('div');
    card.className = 'card' + (overdue ? ' overdue' : '') + (t.status === 'done' ? ' done' : '');
    const dateStr = new Date(t.updated_at).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
    const dueHtml = t.due_date ? `<span class="${overdue ? 'overdue' : ''}">📅 ${overdue ? 'متأخرة — ' : ''}${formatDate(t.due_date)}</span>` : '<span>بدون تاريخ</span>';
    const assigneeHtml = assignee ? `<span class="assignee-tag">👤 ${escapeHtml(assignee.name)}</span>` : '';

    const actionButtons = t.status === 'pending'
      ? `<button data-action="done" data-id="${t.id}" class="go-done">تم الإنجاز</button><button data-action="delete-task" data-id="${t.id}" class="danger">حذف</button>`
      : `<button data-action="reopen-task" data-id="${t.id}">إعادة فتح</button><button data-action="delete-task" data-id="${t.id}" class="danger">حذف</button>`;

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="name">${escapeHtml(cap.name)}</div>
          ${cap.phone ? `<div class="phone">${escapeHtml(cap.phone)}</div>` : ''}
        </div>
      </div>
      <div class="desc">${escapeHtml(t.description)}</div>
      <div class="task-line ${overdue ? 'overdue' : ''}">${dueHtml}${assigneeHtml}</div>
      <div class="meta">
        <div class="date">${dateStr}</div>
        <div class="actions">${actionButtons}</div>
      </div>
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('button[data-action]').forEach(btn => {
    btn.onclick = () => handleTaskAction(btn.dataset.action, btn.dataset.id);
  });
}

async function handleTaskAction(action, id){
  if(action === 'delete-task'){
    if(!confirm('حذف هذي المهمة نهائيًا؟')) return;
    try{
      await api(`tasks?id=eq.${id}`, { method:'DELETE' });
      tasks = tasks.filter(t => t.id !== id);
      renderTaskTabs(); renderTasks();
    }catch(e){ alert('تعذر الحذف'); }
    return;
  }
  const newStatus = action === 'done' ? 'done' : 'pending';
  try{
    await api(`tasks?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ status:newStatus, updated_at:new Date().toISOString() }) });
    const t = tasks.find(x => x.id === id);
    if(t){ t.status = newStatus; t.updated_at = new Date().toISOString(); }
    renderTaskTabs(); renderTasks();
  }catch(e){ alert('تعذر التحديث'); }
}
document.getElementById('taskSearch').oninput = renderTasks;

// ================= نموذج الحالات =================
const cName = document.getElementById('cName');
const cPhone = document.getElementById('cPhone');
const cPhoneError = document.getElementById('cPhoneError');
const cPhoneHint = document.getElementById('cPhoneHint');
const cNotes = document.getElementById('cNotes');
const typeRow = document.getElementById('typeRow');
const newTypeBox = document.getElementById('newTypeBox');
const saveCaseBtn = document.getElementById('saveCaseBtn');

cPhone.addEventListener('input', () => {
  cPhoneError.classList.remove('show');
  const phone = cPhone.value.trim();
  const match = phone ? captains.find(c => (c.phone||'').trim() === phone) : null;
  if(match){
    cPhoneHint.textContent = `✓ كابتن موجود: ${match.name} — راح تُضاف له حالة جديدة`;
    cPhoneHint.classList.add('match');
    if(!cName.value.trim()) cName.value = match.name;
  } else {
    cPhoneHint.textContent = ''; cPhoneHint.classList.remove('match');
  }
});

document.querySelectorAll('#notePresets .note-chip').forEach(chip => {
  chip.onclick = () => {
    cNotes.value = cNotes.value.trim() ? `${cNotes.value.trim()}\n${chip.textContent}` : chip.textContent;
    cNotes.focus();
  };
});

function renderTypeChips(){
  typeRow.innerHTML = '';
  types.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedType === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = () => { selectedType = t; newTypeBox.classList.remove('open'); renderTypeChips(); };
    typeRow.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add';
  addChip.textContent = '+ نوع جديد';
  addChip.onclick = () => newTypeBox.classList.toggle('open');
  typeRow.appendChild(addChip);
}
document.getElementById('addTypeConfirm').onclick = () => {
  const input = document.getElementById('newTypeLabel');
  const val = input.value.trim();
  if(!val) { input.focus(); return; }
  if(!types.includes(val)) types.push(val);
  selectedType = val;
  input.value = '';
  newTypeBox.classList.remove('open');
  renderTypeChips();
};

saveCaseBtn.onclick = async () => {
  const name = cName.value.trim();
  if(!name){ cName.focus(); return; }
  const phone = cPhone.value.trim();
  const notes = cNotes.value.trim();
  if(!selectedType){ alert('اختر نوع الحالة'); return; }

  saveCaseBtn.disabled = true;
  try{
    const captainId = await findOrCreateCaptain(name, phone);
    await api('cases', {
      method: 'POST',
      body: JSON.stringify({ captain_id: captainId, case_type: selectedType, status:'new', notes: notes || null }),
    });
    cases = await api('cases?select=*&order=updated_at.desc');
    cName.value=''; cPhone.value=''; cNotes.value=''; cPhoneHint.textContent='';
    renderCaseTabs(); renderCases();
  }catch(e){
    alert('تعذر الحفظ، تحقق من الاتصال وحاول مرة أخرى');
  }finally{
    saveCaseBtn.disabled = false;
  }
};

const STATUS_LABELS = { new:'جديدة', in_progress:'قيد المعالجة', waiting_captain:'بانتظار رد الكابتن', resolved:'تم الحل', closed_unresolved:'مغلقة بدون حل' };
function caseBucket(c){
  if(c.status === 'resolved' || c.status === 'closed_unresolved'){
    const days = (Date.now() - new Date(c.updated_at).getTime()) / 86400000;
    return days <= 7 ? 'closed' : null;
  }
  if(c.status === 'waiting_captain') return 'waiting';
  return 'due';
}
function renderCaseTabs(){
  const counts = { due:0, waiting:0, closed:0 };
  cases.forEach(c => { const b = caseBucket(c); if(b) counts[b]++; });
  const defs = [
    { id:'due', label:'تحتاج ردي الآن', tone:'red' },
    { id:'waiting', label:'بانتظار الكابتن', tone:'amber' },
    { id:'closed', label:'أُغلقت هذا الأسبوع', tone:'green' },
    { id:'all', label:'الكل', tone:null },
  ];
  const tabsEl = document.getElementById('caseTabs');
  tabsEl.innerHTML = '';
  defs.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'dash-tab' + (caseDashFilter === d.id ? ' active' : '');
    if(d.tone) tab.dataset.tone = d.tone;
    const n = d.id === 'all' ? cases.length : counts[d.id];
    tab.innerHTML = `${d.label} <span class="n">${n}</span>`;
    tab.onclick = () => { caseDashFilter = d.id; renderCaseTabs(); renderCases(); };
    tabsEl.appendChild(tab);
  });
}

function renderCases(){
  const q = document.getElementById('caseSearch').value.trim().toLowerCase();
  let items = cases.filter(c => {
    const cap = captainOf(c);
    return !q || cap.name.toLowerCase().includes(q) || (cap.phone||'').includes(q);
  });
  if(caseDashFilter !== 'all') items = items.filter(c => caseBucket(c) === caseDashFilter);
  items = [...items].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

  const listEl = document.getElementById('caseList');
  document.getElementById('caseCount').textContent = items.length ? `${items.length} حالة` : '';
  if(items.length === 0){ listEl.innerHTML = `<div class="empty">لا توجد حالات في هذا القسم</div>`; return; }

  listEl.innerHTML = '';
  items.forEach(c => {
    const cap = captainOf(c);
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = new Date(c.updated_at).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });

    let actionButtons = '';
    if(c.status === 'new' || c.status === 'in_progress'){
      actionButtons = `<button data-action="waiting" data-id="${c.id}" class="go-waiting">بانتظار الكابتن</button>
        <button data-action="resolved" data-id="${c.id}" class="go-resolved">تم الحل</button>
        <button data-action="closed" data-id="${c.id}" class="danger">إغلاق بدون حل</button>`;
    } else if(c.status === 'waiting_captain'){
      actionButtons = `<button data-action="progress" data-id="${c.id}" class="go-progress">الكابتن رد</button>
        <button data-action="resolved" data-id="${c.id}" class="go-resolved">تم الحل</button>
        <button data-action="closed" data-id="${c.id}" class="danger">إغلاق بدون حل</button>`;
    } else {
      actionButtons = `<button data-action="reopen" data-id="${c.id}">إعادة فتح</button>`;
    }
    actionButtons += `<button data-action="delete-case" data-id="${c.id}" class="danger">حذف</button>`;

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="name">${escapeHtml(cap.name)}</div>
          ${cap.phone ? `<div class="phone">${escapeHtml(cap.phone)}</div>` : ''}
        </div>
        <div class="badges">
          <div class="badge type">${escapeHtml(c.case_type)}</div>
          <div class="badge status-${c.status}">${STATUS_LABELS[c.status]}</div>
        </div>
      </div>
      ${c.notes ? `<div class="notes">${escapeHtml(c.notes)}</div>` : ''}
      <div class="meta">
        <div class="date">${dateStr}</div>
        <div class="actions">${actionButtons}</div>
      </div>
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('button[data-action]').forEach(btn => {
    btn.onclick = () => handleCaseAction(btn.dataset.action, btn.dataset.id);
  });
}

async function handleCaseAction(action, id){
  if(action === 'delete-case'){
    if(!confirm('حذف هذي الحالة نهائيًا؟')) return;
    try{
      await api(`cases?id=eq.${id}`, { method:'DELETE' });
      cases = cases.filter(c => c.id !== id);
      renderCaseTabs(); renderCases();
    }catch(e){ alert('تعذر الحذف'); }
    return;
  }
  const statusMap = { waiting:'waiting_captain', progress:'in_progress', resolved:'resolved', closed:'closed_unresolved', reopen:'in_progress' };
  const newStatus = statusMap[action];
  if(!newStatus) return;
  try{
    await api(`cases?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ status:newStatus, updated_at:new Date().toISOString() }) });
    const c = cases.find(x => x.id === id);
    if(c){ c.status = newStatus; c.updated_at = new Date().toISOString(); }
    renderCaseTabs(); renderCases();
  }catch(e){ alert('تعذر التحديث'); }
}
document.getElementById('caseSearch').oninput = renderCases;

document.getElementById('exportBtn').onclick = () => {
  const backup = { captains, cases, tasks, team, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `captains-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

if(accessToken){
  refreshSession().then(ok => { if(ok) showApp(); else doLogout(); });
} else {
  showLogin();
}
</script>
