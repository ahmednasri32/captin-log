<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1218">
<title>سجل تصنيف الكباتن</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #171b22;
    --panel-2: #1c212a;
    --line: #2a303c;
    --text: #e8ebf0;
    --muted: #8c96a6;
    --accent: #d99a3c;
    --accent-soft: rgba(217,154,60,0.14);
    --red: #d16158;
    --red-soft: rgba(209,97,88,0.14);
    --amber: #d9b23c;
    --amber-soft: rgba(217,178,60,0.14);
    --green: #6aa66b;
    --green-soft: rgba(106,166,107,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }
  header{ margin-bottom: 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  h1{ font-size: 1.45rem; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.2px; }
  .sub{ color: var(--muted); font-size: 0.92rem; display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); display:inline-block; }
  .dot.off{ background: var(--red); }

  .backup{ display:flex; gap:8px; }
  .icon-btn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .icon-btn:hover{ color: var(--text); border-color: var(--accent); }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 10px; }
  .row > *{ flex:1; min-width: 140px; }
  label{ display:block; font-size:0.82rem; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=email], input[type=password], textarea, select{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea{ resize: vertical; min-height: 54px; }
  input:focus, textarea:focus, select:focus{ outline: none; border-color: var(--accent); }

  .status-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; align-items:center; }
  .status-chip{
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }
  .status-chip.active{ border-color: transparent; color: #17140f; font-weight: 600; }
  .status-chip[data-tone="green"].active{ background: #8fc990; color:#123212; }
  .status-chip[data-tone="amber"].active{ background: #e6c565; color:#332a08; }
  .status-chip[data-tone="red"].active{ background: #e18179; color:#3a0d09; }
  .status-chip[data-tone="neutral"].active{ background: #aeb7c4; color:#1a1e25; }
  .status-chip.add{ border-style: dashed; color: var(--accent); }

  .new-status-box{
    display:none; gap:8px; align-items:center; margin: -4px 0 12px; flex-wrap: wrap;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  .new-status-box.open{ display:flex; }
  .new-status-box input{ flex:1; min-width: 120px; }
  .tone-dot{ width:20px; height:20px; border-radius:50%; cursor:pointer; border: 2px solid transparent; }
  .tone-dot[data-tone="green"]{ background:#8fc990; }
  .tone-dot[data-tone="amber"]{ background:#e6c565; }
  .tone-dot[data-tone="red"]{ background:#e18179; }
  .tone-dot[data-tone="neutral"]{ background:#aeb7c4; }
  .tone-dot.selected{ border-color: #fff; }

  button.primary{
    background: var(--accent); color: #211705; border: none; padding: 10px 20px;
    border-radius: 7px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:disabled{ opacity:0.5; cursor:default; }
  button.ghost{
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 9px 16px; border-radius: 7px; font-size: 0.88rem; cursor: pointer;
  }
  button.ghost:hover{ color: var(--text); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
  .search{ flex: 2; min-width: 180px; }
  .filter-chip{
    padding: 9px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 0.85rem; cursor: pointer; white-space: nowrap;
  }
  .filter-chip.active{ background: var(--amber-soft); border-color: var(--amber); color: var(--amber); font-weight:600; }

  .count{ color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card.stagnant{ border-color: var(--red); }
  .card-top{ display:flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .name{ font-weight: 700; font-size: 1.02rem; }
  .phone{ color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .badges{ display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .badge{ font-size: 0.78rem; padding: 4px 11px; border-radius: 20px; white-space: nowrap; font-weight: 600; }
  .badge[data-tone="green"]{ background: var(--green-soft); color: var(--green); }
  .badge[data-tone="amber"]{ background: var(--amber-soft); color: var(--amber); }
  .badge[data-tone="red"]{ background: var(--red-soft); color: var(--red); }
  .badge[data-tone="neutral"]{ background: rgba(255,255,255,0.07); color: var(--muted); }
  .badge.stagnant-badge{ background: var(--red-soft); color: var(--red); }

  .notes{ margin-top: 9px; font-size: 0.9rem; color: #c3c9d2; line-height:1.55; white-space: pre-wrap; }
  .meta{ margin-top: 10px; display:flex; justify-content: space-between; align-items:center; }
  .date{ font-size: 0.76rem; color: var(--muted); }
  .actions{ display:flex; gap: 14px; }
  .actions button{ background:none; border:none; color: var(--muted); font-size: 0.8rem; cursor:pointer; padding:0; }
  .actions button:hover{ color: var(--text); }
  .actions button.danger:hover{ color: var(--red); }
  .actions button.resolve{ color: var(--green); font-weight: 600; }
  .actions button.resolve:hover{ color: #8fc990; }
  .actions button{
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    background: var(--panel-2);
  }
  .actions button.resolve{ border-color: var(--green); background: var(--green-soft); }
  .actions button.danger{ border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .actions button.danger:hover{ background: var(--red); color: #fff; }
  .actions button.resolve:hover{ background: var(--green); color: #123212; }
  .actions button[data-action="edit"]:hover{ border-color: var(--accent); color: var(--accent); }

  .category-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
  .cat-tab{
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 0.85rem; cursor: pointer; white-space: nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .cat-tab .cat-count{
    background: rgba(255,255,255,0.08); border-radius: 10px; padding: 1px 7px; font-size: 0.75rem;
  }
  .cat-tab.active{ color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .cat-tab.active .cat-count{ background: rgba(217,154,60,0.3); }
  .cat-tab[data-tone="green"]{ border-color: rgba(106,166,107,0.4); color: var(--green); }
  .cat-tab[data-tone="green"].active{ background: var(--green-soft); border-color: var(--green); }
  .cat-tab[data-tone="amber"]{ border-color: rgba(217,178,60,0.4); color: var(--amber); }
  .cat-tab[data-tone="amber"].active{ background: var(--amber-soft); border-color: var(--amber); }
  .cat-tab[data-tone="red"]{ border-color: rgba(209,97,88,0.4); color: var(--red); }
  .cat-tab[data-tone="red"].active{ background: var(--red-soft); border-color: var(--red); }
  .cat-tab[data-tone="neutral"]{ border-color: var(--line); color: var(--muted); }
  .cat-tab[data-tone="neutral"].active{ background: rgba(255,255,255,0.08); border-color: #aeb7c4; color: var(--text); }

  .empty{ text-align:center; color: var(--muted); padding: 40px 10px; font-size: 0.92rem; }
#importInput{ display:none; }

  #loginScreen{
    max-width: 360px; margin: 60px auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 26px;
  }
  #loginScreen h2{ margin: 0 0 4px; font-size: 1.2rem; }
  #loginScreen p{ color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
  #loginScreen label{ margin-top: 10px; }
  #loginError{ color: var(--red); font-size: 0.85rem; margin-top: 10px; display:none; }
  #loginBtn{ width: 100%; margin-top: 16px; }
  #appRoot{ display:none; }
  .logout-link{ background:none; border:none; color: var(--muted); font-size: 0.8rem; cursor:pointer; }
  .logout-link:hover{ color: var(--red); }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>سجل تصنيف الكباتن</h2>
  <p>سجّل الدخول للمتابعة</p>
  <label>البريد الإلكتروني</label>
  <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
  <label>كلمة المرور</label>
  <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
  <div id="loginError">بيانات الدخول غير صحيحة</div>
  <button class="primary" id="loginBtn" style="width:100%;">دخول</button>
</div>

<div id="appRoot" class="wrap">
  <header>
    <div>
      <h1>سجل تصنيف الكباتن</h1>
      <div class="sub"><span class="dot" id="statusDot"></span><span id="statusText">جاري الاتصال...</span></div>
    </div>
    <div class="backup">
      <button class="icon-btn" id="exportBtn">تنزيل نسخة احتياطية</button>
      <button class="icon-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label>رقم الجوال (اختياري)</label>
        <input type="text" id="phone" placeholder="05xxxxxxxx">
      </div>
      <div>
        <label>اسم الكابتن</label>
        <input type="text" id="name" placeholder="مثال: محمد أحمد">
      </div>
    </div>

    <label>التصنيف</label>
    <div class="status-row" id="statusRow"></div>

    <div class="new-status-box" id="newStatusBox">
      <input type="text" id="newStatusLabel" placeholder="اسم التصنيف الجديد">
      <div class="tone-dot" data-tone="green"></div>
      <div class="tone-dot" data-tone="amber"></div>
      <div class="tone-dot" data-tone="red"></div>
      <div class="tone-dot" data-tone="neutral"></div>
      <button class="ghost" id="addStatusConfirm">إضافة</button>
    </div>

    <label>ملاحظات</label>
    <textarea id="notes" placeholder="اكتب أي تفاصيل إضافية..."></textarea>

    <div style="margin-top:14px; display:flex; justify-content:flex-end;">
      <button class="primary" id="saveBtn">حفظ</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="بحث بالاسم أو رقم الجوال...">
    <div class="filter-chip" id="stagnantFilter">المشاكل الراكدة (٧+ أيام)</div>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<script>
// ---- إعدادات الاتصال بقاعدة بيانات Supabase ----
const SUPABASE_URL = 'https://mjelywusygupbhguppxl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdEAOsPd9-s5t3tq11xweQ_BQ9ZieBD';
const REST = `${SUPABASE_URL}/rest/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;
const STAGNANT_DAYS = 7;
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000; // 30 دقيقة

let accessToken = sessionStorage.getItem('cl_access_token') || null;
let refreshToken = sessionStorage.getItem('cl_refresh_token') || null;
let inactivityTimer = null;
let refreshTimer = null;

async function refreshSession(){
  if(!refreshToken) return false;
  try{
    const res = await fetch(`${AUTH}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    sessionStorage.setItem('cl_access_token', accessToken);
    sessionStorage.setItem('cl_refresh_token', refreshToken);
    scheduleRefresh(data.expires_in || 3600);
    return true;
  }catch(e){
    return false;
  }
}

function scheduleRefresh(expiresInSeconds){
  clearTimeout(refreshTimer);
  // نجدد الجلسة قبل انتهائها بدقيقتين، طالما المستخدم لم يُسجَّل خروجه بسبب الخمول
  const delay = Math.max((expiresInSeconds - 120) * 1000, 15000);
  refreshTimer = setTimeout(async () => {
    const ok = await refreshSession();
    if(!ok) doLogout('انتهت الجلسة، سجّل الدخول مرة أخرى');
  }, delay);
}

function authHeaders(){
  return {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${accessToken}`,
    'Content-Type': 'application/json',
  };
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  resetInactivityTimer();
  loadAll();
}

function showLogin(msg){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  clearTimeout(inactivityTimer);
  if(msg){
    const err = document.getElementById('loginError');
    err.textContent = msg;
    err.style.display = 'block';
  }
}

function doLogout(msg){
  accessToken = null;
  refreshToken = null;
  clearTimeout(refreshTimer);
  sessionStorage.removeItem('cl_access_token');
  sessionStorage.removeItem('cl_refresh_token');
  showLogin(msg || null);
}

function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    doLogout('تم تسجيل خروجك تلقائيًا بعد ٣٠ دقيقة من عدم النشاط، سجّل الدخول مرة أخرى');
  }, INACTIVITY_LIMIT_MS);
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt => {
  document.addEventListener(evt, () => { if(accessToken) resetInactivityTimer(); });
});

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  if(!email || !password) return;
  try{
    const res = await fetch(`${AUTH}/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if(!res.ok){
      errBox.textContent = 'بيانات الدخول غير صحيحة';
      errBox.style.display = 'block';
      return;
    }
    const data = await res.json();
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    sessionStorage.setItem('cl_access_token', accessToken);
    sessionStorage.setItem('cl_refresh_token', refreshToken);
    scheduleRefresh(data.expires_in || 3600);
    showApp();
  }catch(e){
    errBox.textContent = 'تعذر الاتصال، حاول مرة أخرى';
    errBox.style.display = 'block';
  }
};

document.getElementById('logoutBtn').onclick = () => doLogout();

let statuses = [];
let entries = [];
let selectedStatus = null;
let editingId = null;
let stagnantOnly = false;
let selectedCategory = null; // null = الكل
let newStatusTone = 'amber';

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const statusRow = document.getElementById('statusRow');
const searchEl = document.getElementById('search');
const newStatusBox = document.getElementById('newStatusBox');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const saveBtn = document.getElementById('saveBtn');

function setConnection(ok, msg){
  statusDot.classList.toggle('off', !ok);
  statusText.textContent = msg;
}

async function api(path, options = {}){
  let res = await fetch(`${REST}/${path}`, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) },
  });
  if(res.status === 401){
    const refreshed = await refreshSession();
    if(refreshed){
      res = await fetch(`${REST}/${path}`, {
        ...options,
        headers: { ...authHeaders(), ...(options.headers || {}) },
      });
    }
    if(!refreshed || res.status === 401){
      doLogout('انتهت الجلسة، سجّل الدخول مرة أخرى');
      throw new Error('unauthorized');
    }
  }
  if(!res.ok){
    const errText = await res.text().catch(() => '');
    throw new Error(`${res.status} ${errText}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function renderStatusChips(){
  statusRow.innerHTML = '';
  statuses.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'status-chip' + (s.id === selectedStatus ? ' active' : '');
    chip.dataset.tone = s.tone;
    chip.textContent = s.label;
    chip.onclick = () => { selectedStatus = s.id; newStatusBox.classList.remove('open'); renderStatusChips(); };
    statusRow.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'status-chip add';
  addChip.textContent = '+ تصنيف جديد';
  addChip.onclick = () => newStatusBox.classList.toggle('open');
  statusRow.appendChild(addChip);
}

document.querySelectorAll('.tone-dot').forEach(dot => {
  dot.onclick = () => {
    document.querySelectorAll('.tone-dot').forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
    newStatusTone = dot.dataset.tone;
  };
});
document.querySelector('.tone-dot[data-tone="amber"]').classList.add('selected');

document.getElementById('addStatusConfirm').onclick = async () => {
  const labelInput = document.getElementById('newStatusLabel');
  const label = labelInput.value.trim();
  if(!label) { labelInput.focus(); return; }
  const id = 'c_' + Date.now().toString(36);
  const sort_order = statuses.length + 1;
  try{
    await api('statuses', { method: 'POST', body: JSON.stringify({ id, label, tone: newStatusTone, sort_order }) });
    statuses.push({ id, label, tone: newStatusTone, sort_order });
    selectedStatus = id;
    labelInput.value = '';
    newStatusBox.classList.remove('open');
    renderStatusChips();
    renderCategoryTabs();
  }catch(e){
    alert('تعذر إضافة التصنيف، حاول مرة أخرى');
  }
};

function statusInfo(id){
  return statuses.find(s => s.id === id) || statuses[0] || { id:'ok', label:'عادي', tone:'green' };
}

async function loadAll(){
  try{
    statuses = await api('statuses?select=*&order=sort_order.asc');
    entries = await api('captains?select=*&order=updated_at.desc');
    selectedStatus = statuses[0] ? statuses[0].id : null;
    setConnection(true, 'متصل — البيانات تتزامن أونلاين');
    saveBtn.disabled = false;
    renderStatusChips();
    renderCategoryTabs();
    render();
  }catch(e){
    setConnection(false, 'تعذر الاتصال بقاعدة البيانات');
    saveBtn.disabled = true;
  }
}

function resetForm(){
  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('notes').value = '';
  selectedStatus = statuses[0] ? statuses[0].id : null;
  editingId = null;
  saveBtn.textContent = 'حفظ';
  renderStatusChips();
}

saveBtn.onclick = async () => {
  const name = document.getElementById('name').value.trim();
  if(!name){ document.getElementById('name').focus(); return; }
  const phone = document.getElementById('phone').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const payload = { name, phone, notes, status_id: selectedStatus, updated_at: new Date().toISOString() };

  saveBtn.disabled = true;
  try{
    if(editingId){
      const updated = await api(`captains?id=eq.${editingId}`, {
        method: 'PATCH',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify(payload),
      });
      entries = entries.map(e => e.id === editingId ? updated[0] : e);
    } else {
      const created = await api('captains', {
        method: 'POST',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify(payload),
      });
      entries = [created[0], ...entries];
    }
    resetForm();
    renderCategoryTabs();
    render();
  }catch(e){
    alert('تعذر الحفظ، تحقق من الاتصال وحاول مرة أخرى');
  }finally{
    saveBtn.disabled = false;
  }
};

function isStagnant(e){
  const baseline = statuses[0] ? statuses[0].id : null;
  if(e.status_id === baseline) return false;
  const days = (Date.now() - new Date(e.updated_at).getTime()) / 86400000;
  return days >= STAGNANT_DAYS;
}

document.getElementById('stagnantFilter').onclick = () => {
  stagnantOnly = !stagnantOnly;
  document.getElementById('stagnantFilter').classList.toggle('active', stagnantOnly);
  render();
};

function renderCategoryTabs(){
  const tabsEl = document.getElementById('categoryTabs');
  tabsEl.innerHTML = '';

  const allTab = document.createElement('div');
  allTab.className = 'cat-tab' + (selectedCategory === null ? ' active' : '');
  allTab.innerHTML = `الكل <span class="cat-count">${entries.length}</span>`;
  allTab.onclick = () => { selectedCategory = null; renderCategoryTabs(); render(); };
  tabsEl.appendChild(allTab);

  statuses.forEach(s => {
    const count = entries.filter(e => e.status_id === s.id).length;
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (selectedCategory === s.id ? ' active' : '');
    tab.dataset.tone = s.tone;
    tab.innerHTML = `${escapeHtml(s.label)} <span class="cat-count">${count}</span>`;
    tab.onclick = () => { selectedCategory = s.id; renderCategoryTabs(); render(); };
    tabsEl.appendChild(tab);
  });
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  let items = entries.filter(e => !q || e.name.toLowerCase().includes(q) || (e.phone||'').includes(q));

  if(selectedCategory !== null){
    items = items.filter(e => e.status_id === selectedCategory);
  }

  if(stagnantOnly){
    items = items.filter(isStagnant);
    items = [...items].sort((a,b) => new Date(a.updated_at) - new Date(b.updated_at));
  } else {
    items = [...items].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  }

  countEl.textContent = items.length ? `${items.length} كابتن` : '';

  if(items.length === 0){
    const emptyMsg = stagnantOnly
      ? 'لا توجد مشاكل راكدة حالياً'
      : (selectedCategory !== null ? 'لا يوجد كباتن في هذا التصنيف' : 'لا يوجد كباتن مسجلين بعد');
    listEl.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  listEl.innerHTML = '';
  items.forEach(e => {
    const info = statusInfo(e.status_id);
    const stagnant = isStagnant(e);
    const card = document.createElement('div');
    card.className = 'card' + (stagnant ? ' stagnant' : '');
    const dateStr = new Date(e.updated_at).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
    const baseline = statuses[0] ? statuses[0].id : null;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="name">${escapeHtml(e.name)}</div>
          ${e.phone ? `<div class="phone">${escapeHtml(e.phone)}</div>` : ''}
        </div>
        <div class="badges">
          <div class="badge" data-tone="${info.tone}">${escapeHtml(info.label)}</div>
          ${stagnant ? '<div class="badge stagnant-badge">راكدة</div>' : ''}
        </div>
      </div>
      ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
      <div class="meta">
        <div class="date">${dateStr}</div>
        <div class="actions">
          ${e.status_id !== baseline ? `<button data-action="resolve" data-id="${e.id}" class="resolve">تمت المعالجة</button>` : ''}
          <button data-action="edit" data-id="${e.id}">تعديل</button>
          <button data-action="delete" data-id="${e.id}" class="danger">حذف</button>
        </div>
      </div>
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll('button[data-action="edit"]').forEach(btn => {
    btn.onclick = () => startEdit(btn.dataset.id);
  });
  listEl.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.onclick = () => deleteEntry(btn.dataset.id);
  });
  listEl.querySelectorAll('button[data-action="resolve"]').forEach(btn => {
    btn.onclick = () => resolveEntry(btn.dataset.id);
  });
}

function startEdit(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  document.getElementById('name').value = e.name;
  document.getElementById('phone').value = e.phone || '';
  document.getElementById('notes').value = e.notes || '';
  selectedStatus = e.status_id;
  editingId = id;
  saveBtn.textContent = 'تحديث';
  renderStatusChips();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteEntry(id){
  try{
    await api(`captains?id=eq.${id}`, { method: 'DELETE' });
    entries = entries.filter(e => e.id !== id);
    renderCategoryTabs();
    render();
  }catch(e){
    alert('تعذر الحذف، حاول مرة أخرى');
  }
}

async function resolveEntry(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  const baseline = statuses[0] ? statuses[0].id : null;
  const todayStr = new Date().toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
  const prevStatusLabel = statusInfo(e.status_id).label;
  const resolutionLine = `✔ تمت المعالجة بتاريخ ${todayStr} (كانت: ${prevStatusLabel})`;
  const newNotes = e.notes ? `${e.notes}\n${resolutionLine}` : resolutionLine;
  try{
    const updated = await api(`captains?id=eq.${id}`, {
      method: 'PATCH',
      headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ status_id: baseline, notes: newNotes, updated_at: new Date().toISOString() }),
    });
    entries = entries.map(x => x.id === id ? updated[0] : x);
    renderCategoryTabs();
    render();
  }catch(e){
    alert('تعذر التحديث، حاول مرة أخرى');
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

searchEl.oninput = render;

// نسخ احتياطي محلي إضافي (اختياري) فوق التزامن السحابي
document.getElementById('exportBtn').onclick = () => {
  const backup = { entries, statuses, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `captains-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

if(accessToken){
  refreshSession().then(ok => {
    if(ok) showApp(); else doLogout();
  });
} else {
  showLogin();
}
</script>
